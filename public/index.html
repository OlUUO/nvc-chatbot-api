<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="NVC Buddy(다정이) — 비폭력대화(NVC) AI 친구. 관찰 → 감정 → 욕구 → 부탁">
  <title>NVC Buddy · 다정이</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🕊️</span>
        <div class="brand-text">
          <h1>NVC Buddy</h1>
          <p class="brand-sub">비폭력대화 AI 친구 · 다정이</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="demo-badge" class="demo-badge hidden" title="AI 서버 연결 없이 데모 응답으로 작동 중">데모 모드</span>
        <button id="btn-font" class="icon-btn" type="button" title="글자 크기 바꾸기">가</button>
        <button id="btn-analyze" class="text-btn" type="button">📊 대화 분석</button>
        <button id="btn-history" class="text-btn" type="button">🗂️ 기록</button>
        <button id="btn-new" class="text-btn" type="button">✏️ 새 대화</button>
      </div>
    </header>

    <!-- 모드 선택 카드 -->
    <nav class="mode-strip" id="mode-strip" aria-label="대화 모드">
      <button class="mode-card active" data-mode="general" type="button">
        <span class="mode-icon" aria-hidden="true">💬</span>
        <span class="mode-name">일반 대화</span>
        <span class="mode-desc">편하게 떠들어요</span>
      </button>
      <button class="mode-card" data-mode="emotion" type="button">
        <span class="mode-icon" aria-hidden="true">😊</span>
        <span class="mode-name">감정 이야기</span>
        <span class="mode-desc">마음을 찾아요</span>
      </button>
      <button class="mode-card" data-mode="convert" type="button">
        <span class="mode-icon" aria-hidden="true">🔄</span>
        <span class="mode-name">문장 바꾸기</span>
        <span class="mode-desc">NVC로 다듬어요</span>
      </button>
      <button class="mode-card" data-mode="practice" type="button">
        <span class="mode-icon" aria-hidden="true">🎭</span>
        <span class="mode-name">대화 연습</span>
        <span class="mode-desc">역할극 해봐요</span>
      </button>
    </nav>

    <!-- NVC 단계 진행 표시 -->
    <div class="nvc-tracker hidden" id="nvc-tracker" aria-label="NVC 단계">
      <span class="tracker-step" data-step="observation">① 관찰</span>
      <span class="tracker-arrow" aria-hidden="true">→</span>
      <span class="tracker-step" data-step="feeling">② 감정</span>
      <span class="tracker-arrow" aria-hidden="true">→</span>
      <span class="tracker-step" data-step="need">③ 욕구</span>
      <span class="tracker-arrow" aria-hidden="true">→</span>
      <span class="tracker-step" data-step="request">④ 부탁</span>
    </div>

    <!-- 채팅 영역 -->
    <main class="chat" id="chat" aria-live="polite"></main>

    <!-- 연습 모드 상태 바 -->
    <div class="practice-bar hidden" id="practice-bar">
      <span id="practice-info" class="practice-info">🎭 연습 중</span>
      <button id="btn-practice-end" class="text-btn small" type="button">연습 종료하고 피드백 받기</button>
    </div>

    <!-- 입력창 -->
    <footer class="composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요..." aria-label="메시지 입력"></textarea>
      <button id="btn-mic" class="mic-btn hidden" type="button" title="음성 입력" aria-label="음성 입력">🎤</button>
      <button id="btn-send" class="send-btn" type="button">전송</button>
    </footer>
    <p class="disclaimer">NVC Buddy는 전문 상담을 대신하지 않아요. 위급한 상황에서는 <b>109</b>(자살예방 상담) 또는 <b>112</b>로 연락하세요.</p>
  </div>

  <!-- 대화 기록 패널 -->
  <div class="panel-backdrop hidden" id="history-backdrop"></div>
  <aside class="panel hidden" id="history-panel" aria-hidden="true" role="dialog" aria-label="대화 기록">
    <div class="panel-head">
      <h2>🗂️ 대화 기록</h2>
      <button id="btn-history-close" class="icon-btn" type="button" aria-label="닫기">✕</button>
    </div>
    <p class="panel-note">기록은 이 브라우저에만 저장돼요. 내용은 날짜·제목·감정·욕구·NVC 문장만 최소한으로 남깁니다.</p>
    <div id="history-list" class="history-list"></div>
    <button id="btn-save-current" class="save-current-btn hidden" type="button">💾 현재 대화 기록에 저장</button>
  </aside>

  <!-- 연습 시나리오 선택 -->
  <div class="modal hidden" id="scenario-modal" role="dialog" aria-modal="true" aria-label="연습 시나리오 선택">
    <div class="modal-card">
      <h2>🎭 어떤 상황을 연습해볼까요?</h2>
      <p class="modal-sub">다정이가 상대방 역할을 맡아요. 연습이 끝나면 별점 피드백을 줍니다.</p>
      <div class="scenario-list" id="scenario-list"></div>
      <button id="btn-scenario-close" class="text-btn" type="button">나중에 할래요</button>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
